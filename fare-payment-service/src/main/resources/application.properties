spring.application.name=fare-payment-service

# Configuration comes from environment variables. For local runs, the shared
# .env file in the project root is loaded automatically (see README).
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

server.port=${FARE_SERVICE_PORT:8084}

# This service owns the "payments" collection in its own database.
spring.mongodb.uri=${FARE_MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${FARE_MONGODB_DATABASE:ridelink_payments}
spring.data.mongodb.auto-index-creation=true

# Verifies tokens from Account Service (users) and Ride Management Service (SERVICE role).
ridelink.jwt.secret=${JWT_SECRET:}

server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
