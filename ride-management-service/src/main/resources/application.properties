spring.application.name=ride-management-service

# Configuration comes from environment variables. For local runs, the shared
# .env file in the project root is loaded automatically (see README).
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

server.port=${RIDE_SERVICE_PORT:8083}

# This service owns the "rides" collection in its own database.
spring.mongodb.uri=${RIDE_MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${RIDE_MONGODB_DATABASE:ridelink_rides}
spring.data.mongodb.auto-index-creation=true

# Verifies user tokens and signs short-lived SERVICE tokens for its own outbound calls.
ridelink.jwt.secret=${JWT_SECRET:}

# Synchronous REST dependencies
ridelink.clients.driver-service=${DRIVER_SERVICE_URL:http://localhost:8082}
ridelink.clients.fare-service=${FARE_SERVICE_URL:http://localhost:8084}
ridelink.clients.connect-timeout-ms=2000
ridelink.clients.read-timeout-ms=5000

server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
logging.level.com.ridelink.ride=INFO
