spring.application.name=driver-vehicle-service

# Configuration comes from environment variables. For local runs, the shared
# .env file in the project root is loaded automatically (see README).
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

server.port=${DRIVER_SERVICE_PORT:8082}

# This service owns the "drivers" and "vehicles" collections in its own database.
spring.mongodb.uri=${DRIVER_MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${DRIVER_MONGODB_DATABASE:ridelink_drivers}
spring.data.mongodb.auto-index-creation=true

# Tokens are issued by Account Service; this service only verifies them.
ridelink.jwt.secret=${JWT_SECRET:}

# Synchronous REST dependency
ridelink.clients.account-service=${ACCOUNT_SERVICE_URL:http://localhost:8081}
ridelink.clients.connect-timeout-ms=2000
ridelink.clients.read-timeout-ms=5000

# Matching rule: only drivers whose location is fresher than this are eligible.
ridelink.matching.location-max-age-minutes=${DRIVER_LOCATION_MAX_AGE_MINUTES:30}

server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
