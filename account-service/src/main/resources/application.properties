spring.application.name=account-service

# Configuration comes from environment variables. For local runs, the shared
# .env file in the project root is loaded automatically (see README).
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

server.port=${ACCOUNT_SERVICE_PORT:8081}

# This service owns the "accounts" collection in its own database.
spring.mongodb.uri=${ACCOUNT_MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${ACCOUNT_MONGODB_DATABASE:ridelink_accounts}
spring.data.mongodb.auto-index-creation=true

# JWT: Account Service is the only service that issues user tokens.
ridelink.jwt.secret=${JWT_SECRET:}
ridelink.jwt.ttl-minutes=${JWT_TTL_MINUTES:120}

# Built-in administrator (not stored in the database).
ridelink.admin.username=${ADMIN_USERNAME:admin@ridelink.lk}
ridelink.admin.password=${ADMIN_PASSWORD:}

server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
