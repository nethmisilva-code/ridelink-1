name: RideLink integration (Postman)

# Starts MongoDB and all four services, then runs the full Postman collection
# (successful and negative workflows) with Newman. Run it from the Actions tab.
on:
  workflow_dispatch:

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      JWT_SECRET: ci-integration-jwt-secret-not-used-elsewhere
      ADMIN_USERNAME: admin@ridelink.lk
      ADMIN_PASSWORD: Admin@12345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build all services
        run: |
          for s in account-service driver-vehicle-service ride-management-service fare-payment-service; do
            (cd $s && chmod +x mvnw && ./mvnw -B -ntp -q -DskipTests package)
          done

      - name: Start all services
        run: |
          mkdir -p logs
          for s in account-service driver-vehicle-service fare-payment-service ride-management-service; do
            (cd $s && nohup java -jar $(ls target/*.jar | head -1) > ../logs/$s.log 2>&1 &)
          done
          for p in 8081 8082 8083 8084; do
            for i in $(seq 1 60); do
              curl -fs http://localhost:$p/actuator/health | grep -q UP && echo "port $p UP" && break
              sleep 2
            done
          done

      - name: Run Postman collection
        run: |
          mkdir -p reports
          npx --yes newman run postman/RideLink.postman_collection.json \
            -e postman/RideLink-Local.postman_environment.json \
            --reporters cli,junit --reporter-junit-export reports/newman-results.xml

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            logs/
            reports/
